name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nc
          POSTGRES_PASSWORD: nc
          POSTGRES_DB: notecyclopedia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nc -d notecyclopedia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nc:nc@localhost:5432/notecyclopedia_test
      NC_TEST_DATABASE_URL: postgres://nc:nc@localhost:5432/notecyclopedia_test
      BETTER_AUTH_SECRET: integration-test-secret-at-least-32-characters-long
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Install Playwright browser
        run: pnpm --filter @nc/web exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
